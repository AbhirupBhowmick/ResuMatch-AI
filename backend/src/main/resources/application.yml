spring:
  application:
    name: resumatch-ai

  # Database Configuration (Neon/PostgreSQL or H2 Mem for local dev)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:resumatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # File Upload Settings
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Security & OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - email
              - profile

# JWT Authentication
jwt:
  secret: ${JWT_SECRET:resumatch_ai_local_super_secret_jwt_key_2026_dev}
  expirationMs: 86400000 # 24 hours

# AI Integration
gemini:
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  api:
    key: ${GEMINI_API_KEY}

# Server & Proxy Configuration
server:
  # Uses Railway's dynamic port, defaults to 8080
  port: ${PORT:8080}
  # CRITICAL: Tells Spring to trust 'X-Forwarded-Proto' headers from Railway's proxy
  # This fixes the 'http' vs 'https' redirect mismatch in Google OAuth
  forward-headers-strategy: framework
  error:
    include-message: always

app:
  frontend-url: ${FRONTEND_URL:https://resu-match-ai-eight.vercel.app}

google:
  client-id: ${GOOGLE_CLIENT_ID:}


